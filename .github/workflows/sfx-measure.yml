name: sfx-measure

on:
  push:
    branches: ['claude/probe-sfx']

permissions:
  contents: write

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0]
    env:
      SHARD: ${{ matrix.shard }}
      SHARDS: '1'
      LIMIT: '14'
      PLAY_S: '4.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright and Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          echo "GS_CHROMIUM=$(python -c 'from playwright.sync_api import sync_playwright as s; p=s().start(); print(p.chromium.executable_path); p.stop()')" >> "$GITHUB_ENV"
      - name: Serve repo
        run: |
          python -m http.server 8000 --bind 127.0.0.1 > server.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS -o /dev/null http://127.0.0.1:8000/ && break; sleep 1; done
      - name: Measure
        run: python scripts/measure_sfx.py sfx-out 2>&1 | tee sfx.log
      - name: Commit results to this branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p sfx-results && cp -r sfx-out/. sfx-results/ 2>/dev/null || true
          cp sfx.log "sfx-results/sfx-shard${SHARD}.log" 2>/dev/null || true
          git add sfx-results
          git commit -m "sfx results shard ${SHARD} (run ${{ github.run_id }})" || exit 0
          for i in 1 2 3 4; do git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}" && break; sleep $((i*3)); done
