name: vfx-capture

on:
  push:
    branches: ['claude/probe-vfx-anchor-v3']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright and Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          echo "GS_CHROMIUM=$(python -c 'from playwright.sync_api import sync_playwright as s; p=s().start(); print(p.chromium.executable_path); p.stop()')" >> "$GITHUB_ENV"

      - name: Runtime file md5
        run: |
          cmp index.html GS_Action_v34_runtime.html
          md5sum index.html GS_Action_v34_runtime.html

      - name: Serve repo
        run: |
          python -m http.server 8000 --bind 127.0.0.1 > server.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS -o /dev/null http://127.0.0.1:8000/ && break; sleep 1; done

      - name: Capture VFX
        run: python scripts/capture_vfx.py vfx-captures

      - name: Upload captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vfx-captures
          path: vfx-captures

      - name: Commit captures to this branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vfx-captures
          git commit -m "vfx captures (run ${{ github.run_id }})" || exit 0
          git push origin "HEAD:${{ github.ref_name }}"
