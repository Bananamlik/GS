name: tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright and Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          echo "GS_CHROMIUM=$(python -c 'from playwright.sync_api import sync_playwright as s; p=s().start(); print(p.chromium.executable_path); p.stop()')" >> "$GITHUB_ENV"

      - name: Runtime files and md5
        run: |
          cmp index.html GS_Action_v34_runtime.html
          md5sum index.html GS_Action_v34_runtime.html

      - name: Check test count (expect 51)
        run: |
          python - <<'PY'
          import sys, unittest
          sys.path.insert(0, 'tests')
          def count(s):
              return sum(count(x) if isinstance(x, unittest.TestSuite) else 1 for x in s)
          n = count(unittest.defaultTestLoader.discover('tests'))
          print('tests collected:', n)
          sys.exit(0 if n == 51 else 1)
          PY

      - name: Serve repo
        run: |
          python -m http.server 8000 --bind 127.0.0.1 > server.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS -o /dev/null http://127.0.0.1:8000/ && break; sleep 1; done

      - name: Run tests
        run: |
          python -m unittest discover -s tests -v 2>&1 | tee tests.log; rc="${PIPESTATUS[0]}"
          if [ "$rc" != "0" ]; then
            grep -E '^(FAIL|ERROR): ' tests.log | cut -c1-300 | while read -r line; do echo "::error title=test failed::$line"; done
            grep -E '^[A-Za-z_.]*(Error|Exception)[A-Za-z]*: ' tests.log | head -6 | cut -c1-900 | while read -r line; do echo "::error title=failure detail::$line"; done
          fi
          exit "$rc"

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-log
          path: |
            tests.log
            server.log
